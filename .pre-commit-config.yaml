# Run `make hooks` (or `pre-commit install`) once per clone.
# The hooks mirror `make lint`; the local mypy hook uses the Hatch environment
# so it sees the project dependencies and the pydantic plugin.
minimum_pre_commit_version: "3.7.0"

repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.1
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files
      - id: check-toml
      - id: check-yaml
      - id: end-of-file-fixer
      - id: mixed-line-ending
      - id: trailing-whitespace

  - repo: local
    hooks:
      - id: mypy
        name: mypy (strict)
        entry: hatch run mypy
        language: system
        types: [python]
        pass_filenames: false
        require_serial: true
