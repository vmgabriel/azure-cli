# ==============================================================================
# azure-cli — Hatch project configuration
# Clean Architecture · DDD · Screaming Architecture (src layout)
# ==============================================================================

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# ------------------------------------------------------------------------------
# Project metadata
# ------------------------------------------------------------------------------
[project]
name = "azure-cli"
version = "0.3.0"
description = "A comprehensive CLI tool to interact with Azure DevOps (Work Items, PRs, and more)."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Gabriel VM" }]
keywords = ["azure", "azure-devops", "work-items", "wiql", "cli", "typer"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Build Tools",
    "Topic :: Utilities",
]

dependencies = [
    # CLI framework: command routing, argument parsing, rich help output.
    "typer>=0.12",
    # HTTP transport for the Azure DevOps REST API (work items, WIQL, git).
    "requests>=2.31",
    # Validation of the API payloads exchanged with Azure DevOps.
    "pydantic>=2.7",
    # Layered configuration: env vars > .env > ~/.azure_cli/config.toml.
    "pydantic-settings>=2.3",
    # Azure DevOps returns rich-text fields as HTML; they are rendered as text.
    "beautifulsoup4>=4.12",
    # Tables, colours and help output in the terminal.
    "rich>=13.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",   # required by `make test` (--cov reports)
    "httpx>=0.27",       # HTTP client for integration tests against the real API
    "ruff>=0.6",         # linter + formatter used by `make lint` / `make format`
    "mypy>=1.11",        # static type checking used by `make lint`
    "pre-commit>=3.7",   # git hooks used by `make hooks`
]

[project.scripts]
# Console script exposed as `azure-cli`.
azure-cli = "azure_cli.presentation.main:app"

# ------------------------------------------------------------------------------
# Hatch — build targets
# ------------------------------------------------------------------------------
[tool.hatch.build.targets.wheel]
packages = ["src/azure_cli"]

[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/tests",
    "/config",
    "/config.example.toml",
    "/.pre-commit-config.yaml",
    "/README.md",
    "/INSTALL.md",
    "/CONTRIBUTING.md",
    "/Makefile",
]

# ------------------------------------------------------------------------------
# Hatch — environments
# ------------------------------------------------------------------------------
[tool.hatch.envs.default]
# Install the `dev` extra in every Hatch environment. The project itself is
# installed in editable mode by default (`dev-mode`), so `hatch run ...` always
# reflects the working tree.
features = ["dev"]

[tool.hatch.envs.default.scripts]
# `hatch run test`, `hatch run lint`, ... mirror the Makefile targets.
test = "pytest {args:tests}"
test-unit = "pytest {args:tests/unit}"
test-integration = "pytest {args:tests/integration} --run-live"
lint = "ruff check . && ruff format --check . && mypy"
format = "ruff check --fix . && ruff format ."

[tool.hatch.envs.hatch-test]
# Dedicated environment for the test matrix (used by CI).
features = ["dev"]
dependencies = ["coverage[toml]"]

# ------------------------------------------------------------------------------
# Ruff (linter + formatter)
# ------------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]
extend-exclude = [".venv", "venv", "dist", "build"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # import sorting
    "UP",   # pyupgrade
    "B",    # bugbear (common bug patterns)
    "C4",   # comprehensions
    "SIM",  # simplifications
    "RUF",  # ruff-specific rules
]

[tool.ruff.lint.flake8-bugbear]
# B008 flags function calls in argument defaults. `typer.Option`/`typer.Argument`
# are Typer's declarative parameter factories: they return config objects with no
# side effects, so ruff's documented escape hatch for FastAPI/Typer patterns is
# used instead of distorting the command signature.
extend-immutable-calls = ["typer.Option", "typer.Argument"]

[tool.ruff.lint.isort]
known-first-party = ["azure_cli"]

# ------------------------------------------------------------------------------
# mypy
# ------------------------------------------------------------------------------
[tool.mypy]
python_version = "3.11"
plugins = ["pydantic.mypy"]
mypy_path = "src"
files = ["src/azure_cli", "tests"]
strict = true
warn_unreachable = true
show_error_codes = true

# ------------------------------------------------------------------------------
# pytest
# ------------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"
markers = [
    "integration: exercises the real HTTP stack (stub server or Azure DevOps API)",
    "live: requires real Azure DevOps credentials (AZURE_DEVOPS_PAT) and --run-live",
]

# ------------------------------------------------------------------------------
# coverage
# ------------------------------------------------------------------------------
[tool.coverage.run]
source = ["src/azure_cli"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = false
fail_under = 80
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
    "@abstractmethod",
]
